{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Tienda de Videojuegos{% endblock %}</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Scripts -->
    <script src="{% static 'js/script.js' %}" defer></script>
</head>

<body class="bg-body text-body">
    <header class="d-flex justify-content-end align-items-center p-3">
    <button id="themeToggle" class="btn btn-outline-light d-flex align-items-center justify-content-center rounded-circle shadow-sm" type="button" style="width:42px;height:42px;">
        <i class="fa-solid fa-sun"></i>
    </button>
</header>
    

    {% block content %}
    <!-- Aquí irá el contenido específico de cada página -->
    {% endblock %}

    <footer class="text-center mt-5 mb-3">
        <p>© 2026 Tienda de Videojuegos</p>
        <a href="{% url 'home' %}" class="text-body">Inicio</a>
        <a href="{% url 'contacto' %}" class="text-body ms-3">Contacto</a>
    </footer>
</body>
</html>
